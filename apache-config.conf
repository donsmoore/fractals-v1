# Apache Virtual Host Configuration for Fractals v1
# Place this file in /etc/apache2/sites-available/fractals-v1.conf
# Then enable it with: sudo a2ensite fractals-v1.conf
# Enable required modules: sudo a2enmod proxy proxy_http rewrite headers
# Restart Apache: sudo systemctl restart apache2

# Add this to your existing VirtualHost or create a new one
# This assumes you're adding to an existing VirtualHost configuration

# Reverse proxy for Fractals v1 Go application
ProxyPreserveHost On
ProxyPass /fractals/v1 http://localhost:8080/
ProxyPassReverse /fractals/v1 http://localhost:8080/

# Optional: Add specific error handling
<Location /fractals/v1>
    Require all granted
    # Optional: Add security headers
    # Header always set X-Content-Type-Options "nosniff"
    # Header always set X-Frame-Options "SAMEORIGIN"
</Location>

